[project]
name = "stitch-text"
version = "0.1.3"
description = "Convert DejaVu Sans glyphs into deterministic three-level cross-stitch patterns."
readme = "README.md"
authors = [
    { name = "Thomas Ammitzbøll-Bach", email = "tab@uu.dk" }
]
requires-python = ">=3.14"
dependencies = [
    "Pillow>=8.0",
    "reportlab>=5.0.0",
]

[project.scripts]
stch_txt = "stitch_text.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
source-include = ["local-example.toml"]

[tool.mypy]
python_version = "3.14"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.1",
    "ty>=0.0.68",
]
